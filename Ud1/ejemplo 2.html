<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo 2</title>
</head>
<body>
<h1>Elemento meter</h1>

<p>Define una medicion dentro de un rango conocido:</p>

<label for="disk_c">Disk usage C:</label>
<meter id="disk_c" value="2" min="0" max="10">2 out of 10</meter><br>

<label for="disk_d">Disk usage D:</label>
<meter id="disk_d" value="0.6">60%</meter>

<p><strong>Note:</strong> The meter tag is not supported in Edge 12 (or earlier).</p>

<h1>The progress element</h1>

<label for="file">Downloading progress:</label>
<progress id="file" value="32" min="0" max="100"> </progress><br>
<label for="file2">Downloading progress:</label>
<progress id="file2" value="0.32"> 32% </progress>



</body>
</html>
