<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        h1
        {
            font-size: 42px;
            color: #5b42b5;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }
        body
        {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #e8dcff, #d9f5e8, #ffe1f2);
        }
        .digi
        {
            background-color: #8669ff;

        }
        .lm
        {
            background-color: #1f6f5f;

        }
        button
        {
            border-collapse:collapse;
            border-radius:10px;
            height: 200px;
            width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            padding-bottom: 1rem;
            margin-bottom: 40px;
            font-size: 50px;
        }
        button:hover
        {
            transform: translateY(-5px);
            filter: brightness(1.08);
        }
       a:hover
       {
           text-decoration: none;
           filter: brightness(1.2);
           transform: scale(1.03);
       }
       a
       {
           display: inline-flex;
           justify-content: center;
           align-items: center;
           text-decoration: none;
           color: white;
           border-radius: 10px;
           height: 100px;
           width: 600px;
           transition: all 0.3s ease;
       }
    </style>
</head>
<h1>INDEX.HTML</h1>
<body>
<nav>
    <button class="digi">
        <a href="https://javiervalencia21.github.io/DIGI2026-2027/index.html">Digitalización</a>
    </button><br>
    <button class="lm">
        <a href="https://javiervalencia21.github.io/DIGI2026-2027/index.html">Lenguaje De Marcas</a>
    </button><br>
</nav>
</body>
</html>
